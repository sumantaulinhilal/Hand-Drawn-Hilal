name: Build Android APK & Web Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Add Capacitor & Build Android APK
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx --yes @capacitor/cli init "Hand Drawn Hilal" "com.handdrawn.hilal" --web-dir dist || true
          npx --yes @capacitor/cli add android || true
          npx --yes @capacitor/cli sync android

          # Inject storage & read permissions into AndroidManifest.xml
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            grep -q "READ_EXTERNAL_STORAGE" android/app/src/main/AndroidManifest.xml || sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" \/>' android/app/src/main/AndroidManifest.xml
          fi

          # Create init.gradle to fix duplicate Kotlin stdlib classes issue
          cat << 'EOF' > init.gradle
          allprojects {
              configurations.all {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOF

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --init-script ../init.gradle

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

